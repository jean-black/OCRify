<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRify - Forgot Password</title>
    <link rel="stylesheet" href="../css/page1_style.css">
</head>
<body>
    <div class="container">

        <header>
            <div class="logo">
                <h1>OCRify</h1>
                <p class="tagline">Extract Text from Images Instantly</p>
            </div>
        </header>

        <main>
            <div class="auth-card">
                <h2>Forgot password?</h2>
                <p class="auth-subtitle">Enter your email and we'll send you a recovery code</p>

                <div id="errorMsg" class="auth-error" style="display:none;"></div>
                <div id="successMsg" class="auth-success" style="display:none;"></div>

                <form id="forgotForm">
                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <button type="submit" class="start-btn" id="submitBtn">
                        <span id="btnText">Send Recovery Code</span>
                        <span id="spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>

                <p class="auth-switch">
                    Remembered it? <a href="/login">Back to Login</a>
                </p>
            </div>
        </main>

        <footer>
            <div class="footer-credits">
                <p>OCRify v1.0 | Developer: Jean Claude | Near East University</p>
            </div>
        </footer>

    </div>

    <script src="../js/page4_forgot.js"></script>
</body>
</html>

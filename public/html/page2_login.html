<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRify - Login</title>
    <link rel="stylesheet" href="../css/page1_style.css">
</head>
<body>
    <div class="container">

        <header>
            <div class="logo">
                <h1>OCRify</h1>
                <p class="tagline">Extract Text from Images Instantly</p>
            </div>
        </header>

        <main>
            <div class="auth-card">
                <h2>Welcome back</h2>
                <p class="auth-subtitle">Sign in to your account to continue</p>

                <div id="errorMsg" class="auth-error" style="display:none;"></div>
                <div id="successMsg" class="auth-success" style="display:none;"></div>

                <form id="loginForm">
                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="start-btn" id="loginBtn">
                        <span id="btnText">Login</span>
                        <span id="spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>

                <p class="auth-switch">
                    Don't have an account? <a href="/signup">Sign up</a>
                </p>
                <p class="auth-switch">
                    <a href="/">Continue without account</a>
                </p>
            </div>
        </main>

        <footer>
            <div class="footer-credits">
                <p>OCRify v1.0 | Developer: Jean Claude | Near East University</p>
            </div>
        </footer>

    </div>

    <script src="../js/page2_login.js"></script>
</body>
</html>

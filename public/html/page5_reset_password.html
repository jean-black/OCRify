<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRify - Reset Password</title>
    <link rel="stylesheet" href="../css/page1_style.css">
</head>
<body>
    <div class="container">

        <header>
            <div class="logo">
                <h1>OCRify</h1>
                <p class="tagline">Extract Text from Images Instantly</p>
            </div>
        </header>

        <main>
            <div class="auth-card">
                <h2>Reset password</h2>
                <p class="auth-subtitle">Enter the code from your email and choose a new password</p>

                <div id="errorMsg" class="auth-error" style="display:none;"></div>

                <form id="resetForm">
                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="auth-field">
                        <label for="code">Recovery Code</label>
                        <input type="text" id="code" name="code" placeholder="6-digit code" maxlength="6"
                               style="letter-spacing:6px;font-size:1.2em;text-align:center;" required>
                    </div>

                    <div class="auth-field">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" required>
                    </div>

                    <div class="auth-field">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required>
                    </div>

                    <button type="submit" class="start-btn" id="resetBtn">
                        <span id="btnText">Reset Password</span>
                        <span id="spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>

                <p class="auth-switch">
                    <a href="/forgot-password">Resend code</a> &middot; <a href="/login">Back to Login</a>
                </p>
            </div>
        </main>

        <footer>
            <div class="footer-credits">
                <p>OCRify v1.0 | Developer: Jean Claude | Near East University</p>
            </div>
        </footer>

    </div>

    <script src="../js/page5_reset.js"></script>
</body>
</html>

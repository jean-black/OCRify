<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRify - Sign Up</title>
    <link rel="stylesheet" href="../css/page1_style.css">
</head>
<body>
    <div class="container">

        <header>
            <div class="logo">
                <h1>OCRify</h1>
                <p class="tagline">Extract Text from Images Instantly</p>
            </div>
        </header>

        <main>
            <div class="auth-card">
                <h2>Create an account</h2>
                <p class="auth-subtitle">Start extracting text from your images today</p>

                <div id="errorMsg" class="auth-error" style="display:none;"></div>

                <form id="signupForm">
                    <div class="auth-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Your name" required>
                    </div>

                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                    </div>

                    <div class="auth-field">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required>
                    </div>

                    <button type="submit" class="start-btn" id="signupBtn">
                        <span id="btnText">Sign Up</span>
                        <span id="spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="/login">Login</a>
                </p>
                <p class="auth-switch">
                    <a href="/">Continue without account</a>
                </p>
            </div>
        </main>

        <footer>
            <div class="footer-credits">
                <p>OCRify v1.0 | Developer: Jean Claude | Near East University</p>
            </div>
        </footer>

    </div>

    <script src="../js/page3_signup.js"></script>
</body>
</html>

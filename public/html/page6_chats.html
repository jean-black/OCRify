<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRify — Messages</title>
    <link rel="stylesheet" href="../css/page6_style.css">
</head>
<body>
<div class="mail-app">

    <!-- ── Header ── -->
    <header class="mail-header">
        <div class="mail-header-left">
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6"  x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <a href="/" class="mail-brand">OCRify</a>
            <span class="mail-brand-sub">Messages</span>
        </div>

        <div class="mail-search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search messages…" autocomplete="off">
        </div>

        <div class="mail-header-right" id="mailHeaderUser"></div>
    </header>

    <!-- ── Body ── -->
    <div class="mail-body">

        <!-- Sidebar -->
        <aside class="mail-sidebar" id="mailSidebar">
            <nav class="mail-nav">
                <a class="nav-item active" data-view="inbox" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
                    <span>Inbox</span>
                    <span class="nav-badge" id="navBadgeInbox"></span>
                </a>
                <a class="nav-item" data-view="starred" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>Starred</span>
                </a>
                <a class="nav-item" data-view="sent" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    <span>Sent</span>
                </a>
                <a class="nav-item" data-view="trash" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                    <span>Trash</span>
                </a>
            </nav>

            <div class="sidebar-divider"></div>

            <div class="friends-panel">
                <div class="friends-panel-title">Friends</div>
                <div id="pendingList" class="pending-list"></div>
                <div id="friendsList" class="friends-list"></div>
                <button class="add-friend-btn" id="addFriendBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add friend
                </button>
            </div>
        </aside>

        <!-- Main content area -->
        <main class="mail-main" id="mailMain">
            <div class="mail-empty">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e0" stroke-width="1.5"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
                <p>Loading…</p>
            </div>
        </main>
    </div>

    <!-- ── Floating compose button ── -->
    <button class="fab-compose" id="fabCompose" title="Compose new message">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
    </button>

    <!-- ── Compose modal ── -->
    <div class="modal-overlay" id="composeOverlay" style="display:none;">
        <div class="compose-modal">
            <div class="compose-header">
                <span>New Message</span>
                <button class="modal-close" id="composeClose">×</button>
            </div>
            <div class="compose-fields">
                <div class="compose-field">
                    <label>To</label>
                    <div class="compose-to-wrap">
                        <input type="text" id="composeTo" placeholder="email address" autocomplete="off">
                        <div class="friend-suggestions" id="friendSuggestions" style="display:none;"></div>
                    </div>
                </div>
                <div class="compose-field">
                    <label>Subject</label>
                    <input type="text" id="composeSubject" placeholder="(no subject)">
                </div>
            </div>
            <textarea id="composeBody" placeholder="Write your message…"></textarea>
            <div class="compose-footer">
                <select id="composeAttach" class="compose-attach-select">
                    <option value="">📎 Attach OCR file (optional)</option>
                </select>
                <button id="composeSend" class="compose-send-btn">
                    <span id="composeSendText">Send</span>
                    <span id="composeSendSpinner" class="spinner" style="display:none;"></span>
                </button>
            </div>
            <p id="composeError" class="compose-error" style="display:none;"></p>
        </div>
    </div>

    <!-- ── Add friend modal ── -->
    <div class="modal-overlay" id="addFriendOverlay" style="display:none;">
        <div class="add-friend-modal">
            <div class="compose-header">
                <span>Add Friend</span>
                <button class="modal-close" id="addFriendClose">×</button>
            </div>
            <div class="add-friend-body">
                <input type="text" id="friendSearchInput" placeholder="Search by name or email…" autocomplete="off">
                <div id="userSearchResults" class="user-search-results"></div>
                <p id="addFriendMsg" class="add-friend-msg" style="display:none;"></p>
            </div>
        </div>
    </div>

</div>
<script src="../js/page6_chats.js"></script>
</body>
</html>
